# Core USB settings
CONFIG_ZMK_USB=y

# Force GPIO external power rail HIGH immediately on boot
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_EXT_POWER_GLOBAL_OFF=n

# Shift register driver enablement
CONFIG_GPIO=y
CONFIG_SPI=y

# Disable power-saving features to keep matrix alive
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Keep console/UART logging disabled for RP2040 stability
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_ZMK_USB_LOGGING=n
