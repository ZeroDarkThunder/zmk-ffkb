# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Disable console/UART output causing linker errors on RP2040
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_BLE=n

# Explicitly enable USB and External Power to drive matrix GPIOs
CONFIG_ZMK_USB=y
CONFIG_ZMK_EXT_POWER=y

# Prevent RP2040 deep sleep locks
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Device Identifiers
CONFIG_USB_DEVICE_MANUFACTURER="fingerpunch"
CONFIG_ZMK_KEYBOARD_NAME="ffkb_v3"
CONFIG_USB_DEVICE_PRODUCT="ffkb_v3"
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
