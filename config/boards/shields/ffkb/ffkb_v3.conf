# Force USB HID stack active
CONFIG_ZMK_USB=y

# Enable External Power control subsystem and force high on boot
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_EXT_POWER_GLOBAL_OFF=n

# Disable deep sleep and idle timeouts completely to isolate matrix behavior
CONFIG_ZMK_SLEEP=n

# Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Keep console/logging off to avoid RP2040 linker crashes
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_ZMK_USB_LOGGING=n
