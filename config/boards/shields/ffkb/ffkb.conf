# Enable Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable underglow
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

#Disable console/UART output causing linker errors on RP2040
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Allow toggling underglow without toggling external power
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Increase BLE power level
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# Logging ( https://zmk.dev/docs/development/usb-logging )
CONFIG_ZMK_USB_LOGGING=y

# Explicitly enable USB
CONFIG_ZMK_USB=n

CONFIG_USB_DEVICE_MANUFACTURER="fingerpunch"
CONFIG_ZMK_KEYBOARD_NAME="ffkb"
CONFIG_USB_DEVICE_PRODUCT="ffkb"
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
